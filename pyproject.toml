[project]
name = "saque"
version = "0.1.0"
description = "Altura do lançamento no saque — Japão × Brasil, VNL 2023 (UFPR, Visão Computacional)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.10",
    "pillow>=13.0.0",
    "scipy>=1.17.1",
]

[project.scripts]
saque-janelas = "saque.janelas:main"
saque-planos = "saque.planos:main"
saque-calibracao = "saque.calibracao:main"
saque-bola = "saque.bola:main"
saque-gif = "saque.gif:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/saque"]
